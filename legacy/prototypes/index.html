<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumivey</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f7f7f5;
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 760px;
    margin: auto;
    background: white;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
}

h1 {
    margin-top: 0;
    font-size: 34px;
}

#chat {
    min-height: 300px;
    margin-bottom: 20px;
}

.message {
    margin-bottom: 14px;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.45;
}

.lumivey {
    background: #f1f1f1;
}

.user {
    background: #e6f4ff;
}

.input-row {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 14px;
    font-size: 16px;
}

button {
    padding: 14px 22px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h1>Welkom bij Lumivey</h1>

    <div id="chat">
        <div class="message lumivey">
            Wat heeft u nodig?
        </div>
    </div>

    <div class="input-row">
        <input id="input" placeholder="Typ hier uw antwoord">
        <button onclick="sendMessage()">Versturen</button>
    </div>
</div>

<script>
let history = [];

async function sendMessage() {
    const input = document.getElementById("input");
    const value = input.value.trim();

    if (!value) return;

    const chat = document.getElementById("chat");

    addMessage("user", value);

    history.push({
        role: "user",
        content: value
    });

    input.value = "";

    const thinkingId = addMessage("lumivey", "Lumivey denkt even mee...");

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: value,
                history: history
            })
        });

        const data = await response.json();

        removeMessage(thinkingId);

        addMessage("lumivey", data.reply);

        history.push({
            role: "assistant",
            content: data.reply
        });

    } catch (error) {
        removeMessage(thinkingId);
        addMessage("lumivey", "Er ging iets mis. Probeer het nogmaals.");
    }

    window.scrollTo(0, document.body.scrollHeight);
}

function addMessage(type, text) {
    const chat = document.getElementById("chat");
    const id = "msg-" + Date.now() + "-" + Math.floor(Math.random() * 1000);

    const div = document.createElement("div");
    div.className = "message " + type;
    div.id = id;
    div.textContent = text;

    chat.appendChild(div);

    return id;
}

function removeMessage(id) {
    const element = document.getElementById(id);
    if (element) {
        element.remove();
    }
}

document.getElementById("input").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
